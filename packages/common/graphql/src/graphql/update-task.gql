mutation updateTask(
  $workspaceId: String!
  $docId: String!
  $blockId: String!
  $input: UpdateTaskInput!
) {
  updateTask(
    workspaceId: $workspaceId
    docId: $docId
    blockId: $blockId
    input: $input
  ) {
    docId
    blockId
    text
    refs {
      offset
      docId
    }
    heading
    order
    checked
    due
    priority
    completedAt
  }
}
