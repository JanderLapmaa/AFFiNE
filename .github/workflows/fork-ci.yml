# The fork's CI: the checks from build-test.yml that cover what the fork ships
# (lint, typecheck, Rust lint, unit and server tests), without the e2e,
# emulator and copilot suites that take ~40 minutes. Upstream's own workflows
# are disabled on the fork (see docs/agents/fork-releases.md).
name: Fork CI

on:
  push:
    branches:
      - canary
    paths-ignore:
      - README.md
  pull_request:
  workflow_dispatch:

env:
  DEBUG: napi:*
  BUILD_TYPE: canary
  APP_NAME: affine
  AFFINE_ENV: dev
  DEPLOYMENT_TYPE: affine

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go (for actionlint)
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          "$(go env GOPATH)/bin/actionlint"
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          full-cache: true
      - name: Run oxlint
        run: yarn lint:ox
      - name: Run i18n codegen
        run: yarn affine @affine/i18n build
      - name: Run Oxfmt
        # Set nmMode in `actions/setup-node` will modify the .yarnrc.yml
        run: |
          git checkout .yarnrc.yml
          yarn lint:format
      - name: Yarn Dedupe
        run: yarn dedupe --check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04-arm
    env:
      NODE_OPTIONS: --max-old-space-size=14384
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          full-cache: true
      - name: Check generated i18n files
        run: |
          yarn affine @affine/i18n build
          git checkout packages/frontend/i18n/src/i18n-completenesses.json
          if git status --porcelain | grep -q .; then
            echo "Run 'yarn affine @affine/i18n build' and commit the generated changes"
            exit 1
          fi
      - name: Run Type Check
        run: yarn typecheck

  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-rust
        with:
          target: x86_64-unknown-linux-gnu
          package: 'affine'
          no-build: 'true'
          cache-key: lint
      - name: fmt check
        run: |
          rustup toolchain add nightly
          rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
          cargo +nightly fmt --all -- --check
      - name: Clippy
        run: |
          rustup component add clippy
          cargo clippy --workspace --exclude affine_server_native --all-targets --all-features -- -D warnings
          cargo clippy -p affine_server_native --all-targets --all-features -- -D warnings

  build-native-linux:
    name: Build AFFiNE native
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      CARGO_PROFILE_RELEASE_LTO: 'thin'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          extra-flags: workspaces focus @affine/native
          electron-install: false
      - name: Build AFFiNE native
        uses: ./.github/actions/build-rust
        with:
          target: x86_64-unknown-linux-gnu
          package: '@affine/native'
      - uses: actions/upload-artifact@v4
        with:
          name: affine.linux-x64-gnu.node
          path: ./packages/frontend/native/affine.linux-x64-gnu.node
          if-no-files-found: error

  unit-test:
    name: Unit Test
    runs-on: ubuntu-24.04
    needs:
      - build-native-linux
    env:
      DISTRIBUTION: web
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: true
          playwright-install: true
          playwright-platform: 'chromium,firefox,webkit'
          full-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: affine.linux-x64-gnu.node
          path: ./packages/frontend/native
      - name: Unit Test
        run: yarn test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  build-server-native:
    name: Build Server native
    runs-on: ubuntu-24.04
    env:
      # The debug key from packages/backend/native/src/lib.rs; tests only.
      AFFINE_PRO_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEObwJiTmbui7rkWfPJ7Lozvuy2Rcl
        otcrb0V6dlS2ijKEShm7ZttTwQn08xzesdjX/AxpoR5X9yfoHkauIBuuMQ==
        -----END PUBLIC KEY-----
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      CARGO_PROFILE_RELEASE_LTO: 'thin'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          extra-flags: workspaces focus @affine/server-native
          electron-install: false
      - name: Build Rust
        uses: ./.github/actions/build-rust
        with:
          target: 'x86_64-unknown-linux-gnu'
          package: '@affine/server-native'
      - uses: actions/upload-artifact@v4
        with:
          name: server-native.node
          path: ./packages/backend/native/server-native.node
          if-no-files-found: error

  server-test:
    name: Server Test
    runs-on: ubuntu-latest
    needs:
      - build-server-native
    strategy:
      fail-fast: false
      matrix:
        node_index: [0, 1, 2, 3]
        total_nodes: [4]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://affine:affine@localhost:5432/affine
      REDIS_SERVER_HOST: localhost
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: affine
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis
        ports:
          - 6379:6379
      mailer:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          extra-flags: workspaces focus @affine/monorepo @affine/server
          electron-install: false
          full-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: server-native.node
          path: ./packages/backend/native
      - name: Prepare Server Test Environment
        uses: ./.github/actions/server-test-env
      - name: Run server tests
        run: yarn affine @affine/server test --forbid-only
        env:
          CARGO_TARGET_DIR: '${{ github.workspace }}/target'
          CI_NODE_INDEX: ${{ matrix.node_index }}
          CI_NODE_TOTAL: ${{ matrix.total_nodes }}

  ci-done:
    name: Fork CI done
    if: always()
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - lint-rust
      - unit-test
      - server-test
    steps:
      - name: Fail if any job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
